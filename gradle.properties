org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Run Kotlin compilation inside the Gradle daemon. A separate Kotlin daemon was
# repeatedly losing its connection (DaemonCrashedException) on low-memory runs.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.workers.max=2
